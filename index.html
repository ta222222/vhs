<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0c0b0a">
  <title>STILL</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --fg: #f3efe6;
      --dim: rgba(243, 239, 230, 0.55);
      --line: rgba(243, 239, 230, 0.16);
      --amber: #ffb25a;
      --safe-b: max(14px, env(safe-area-inset-bottom));
      --safe-t: max(12px, env(safe-area-inset-top));
      --safe-l: max(12px, env(safe-area-inset-left));
      --safe-r: max(12px, env(safe-area-inset-right));
      --chrome-x: max(16px, var(--safe-l));
      --chrome-xr: max(16px, var(--safe-r));
      --dock-gap: 14px;
      --dock-pad: 10px;
      --btn-h: 42px;
      --btn-pad-x: 14px;
      --btn-fs: 11px;
      --shutter: 78px;
      --row-gap: 8px;
      --preset-h: 36px;
    }

    /* iPhone 15/16/17 Pro (~393–402pt) */
    @media (min-width: 390px) and (max-width: 429px) {
      :root {
        --chrome-x: max(18px, var(--safe-l));
        --chrome-xr: max(18px, var(--safe-r));
        --dock-gap: 16px;
        --dock-pad: 12px;
        --btn-h: 44px;
        --btn-pad-x: 14px;
        --shutter: 80px;
        --preset-h: 38px;
        --row-gap: 10px;
      }
    }

    /* iPhone 15/16/17 Pro Max (~430–440pt) */
    @media (min-width: 430px) {
      :root {
        --chrome-x: max(22px, var(--safe-l));
        --chrome-xr: max(22px, var(--safe-r));
        --dock-gap: 18px;
        --dock-pad: 14px;
        --btn-h: 46px;
        --btn-pad-x: 16px;
        --btn-fs: 11px;
        --shutter: 86px;
        --preset-h: 40px;
        --row-gap: 12px;
      }
    }

    /* Tall Pro / Pro Max viewports */
    @media (min-height: 850px) {
      :root {
        --dock-gap: max(var(--dock-gap), 18px);
        --safe-b: max(18px, env(safe-area-inset-bottom));
      }
    }

    @media (min-height: 920px) {
      :root {
        --dock-gap: max(var(--dock-gap), 20px);
        --dock-pad: max(var(--dock-pad), 16px);
        --shutter: max(var(--shutter), 88px);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #070605;
      display: block;
    }

    .chrome {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-t) + 4px) var(--chrome-xr) calc(var(--safe-b) + 6px) var(--chrome-x);
    }

    .top, .bottom, .gate, .viewer, button {
      pointer-events: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      padding: 2px 2px 8px;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--amber);
    }

    .mark i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      display: block;
    }

    body.is-live .mark i {
      animation: blink 1.6s steps(1) infinite;
    }

    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.25; }
    }

    .counter {
      text-align: right;
      color: var(--dim);
      line-height: 1.45;
    }

    .counter b {
      display: block;
      color: var(--dim);
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .dock {
      display: flex;
      flex-direction: column;
      gap: var(--dock-gap);
      pointer-events: none;
      padding: var(--dock-pad) 0 calc(var(--dock-pad) + 2px);
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    .presets, .zoom {
      pointer-events: auto;
      display: flex;
      gap: var(--row-gap);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 4px;
      scroll-snap-type: x proximity;
    }

    .presets::-webkit-scrollbar, .zoom::-webkit-scrollbar { display: none; }

    .zoom { justify-content: center; }

    .presets button, .zoom button, .mode-toggle button {
      min-height: var(--preset-h);
      padding: 0 var(--btn-pad-x);
      flex: 0 0 auto;
      scroll-snap-align: start;
      font-size: var(--btn-fs);
    }

    .presets button.active, .zoom button.active {
      color: #141210;
      background: var(--fg);
      border-color: transparent;
    }

    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      pointer-events: none;
      min-height: calc(var(--shutter) + 8px);
    }

    .bottom .side, .bottom .shutter, .bottom > div { pointer-events: auto; }

    .side {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .side.right { justify-content: flex-end; }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(12, 11, 10, 0.45);
      color: var(--fg);
      font: 500 var(--btn-fs)/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: var(--btn-h);
      padding: 0 var(--btn-pad-x);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button.on {
      color: var(--amber);
      border-color: rgba(255, 178, 90, 0.45);
    }

    button:disabled { opacity: 0.35; }

    .shutter {
      width: var(--shutter);
      height: var(--shutter);
      border-radius: 50%;
      border: 2px solid rgba(243, 239, 230, 0.85);
      background: transparent;
      padding: 0;
      position: relative;
      min-height: 0;
    }

    .shutter::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #f4f0e8;
    }

    .shutter.recording::after {
      background: #e24a3a;
      inset: 14px;
      border-radius: 4px;
    }

    body.mode-video .shutter::after {
      background: #e24a3a;
    }

    .rec-timer {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translateX(-50%);
      color: #e24a3a;
      letter-spacing: 0.14em;
      font-size: 11px;
      display: none;
      white-space: nowrap;
    }

    body.is-recording .rec-timer { display: block; }

    .mode-toggle {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      justify-content: center;
    }

    .mode-toggle button.active {
      color: #141210;
      background: var(--fg);
      border-color: transparent;
    }

    .thumb {
      width: calc(var(--btn-h) + 2px);
      height: calc(var(--btn-h) + 2px);
      padding: 0;
      border-radius: 4px;
      overflow: visible;
      border-color: var(--line);
      position: relative;
      min-height: 0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 3px;
    }

    .thumb .count {
      position: absolute;
      right: -4px;
      top: -6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--amber);
      color: #1a1208;
      font-size: 9px;
      line-height: 16px;
      letter-spacing: 0;
    }

    .gate, .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, var(--safe-t)) max(24px, var(--chrome-xr)) max(24px, var(--safe-b)) max(24px, var(--chrome-x));
    }

    .gate {
      background: rgba(8, 7, 6, 0.28);
      pointer-events: none;
    }

    .gate .card { pointer-events: auto; }

    body.is-live .gate { display: none; }

    .card {
      width: min(340px, 100%);
      padding: 26px 22px 22px;
      background: rgba(16, 14, 12, 0.82);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--dim);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    .card .go {
      width: 100%;
      background: var(--fg);
      color: #141210;
      border-color: transparent;
      min-height: 44px;
    }

    .viewer {
      background: rgba(8, 7, 6, 0.92);
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    body.reviewing .viewer { display: flex; }
    body.reviewing .chrome { display: none; }

    .viewer img,
    .viewer video {
      max-width: min(920px, 100%);
      max-height: calc(100dvh - 160px);
      width: auto;
      height: auto;
      background: #000;
    }

    .viewer .row, .strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .strip {
      max-width: min(920px, 100%);
      overflow-x: auto;
      padding-bottom: 2px;
      flex-wrap: nowrap;
    }

    .strip button {
      width: 56px;
      height: 44px;
      padding: 0;
      border-radius: 3px;
      overflow: hidden;
      flex: 0 0 auto;
      position: relative;
      min-height: 0;
    }

    .strip button.active { outline: 1px solid var(--amber); }

    .strip img, .strip video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .strip button.vid::after {
      content: "▶";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 10px;
      background: rgba(0,0,0,0.28);
      color: #fff;
    }

    .viewer .row button.danger {
      color: #ff8d8d;
      border-color: rgba(255, 141, 141, 0.35);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-b) + var(--shutter) + 92px);
      transform: translateX(-50%);
      background: rgba(16, 14, 12, 0.9);
      border: 1px solid var(--line);
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }

    .toast.show { opacity: 1; }

    .flash {
      position: fixed;
      inset: 0;
      background: #f7f1e6;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }

    .flash.pop { animation: flash 180ms ease-out; }
    .flash.pop-strong { animation: flashStrong 220ms ease-out; }

    @keyframes flash {
      0% { opacity: 0.55; }
      100% { opacity: 0; }
    }

    @keyframes flashStrong {
      0% { opacity: 0.92; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="flash" id="flash"></div>

  <div class="chrome">
    <div class="top">
      <div class="mark"><i></i> Still</div>
      <div class="counter">
        <b id="clock">--:--:--</b>
        <span id="tape">T-00:00</span>
      </div>
    </div>
    <div class="dock">
      <div class="presets" id="presets" role="group" aria-label="Look presets"></div>
      <div class="zoom" id="zoom" role="group" aria-label="Camera zoom">
        <button type="button" data-zoom="0.5" title="13mm ultra-wide, full-frame equivalent" disabled>13mm</button>
        <button type="button" data-zoom="1" class="active" disabled>1×</button>
        <button type="button" data-zoom="2" disabled>2×</button>
        <button type="button" data-zoom="4" disabled>4×</button>
        <button type="button" data-zoom="6" disabled>6×</button>
      </div>
      <div class="mode-toggle" id="modeToggle" role="group" aria-label="Capture mode">
        <button type="button" data-mode="photo" class="active" disabled>Photo</button>
        <button type="button" data-mode="video" disabled>Video</button>
      </div>
      <div class="bottom">
        <div class="side">
          <button type="button" id="flip" disabled>Flip</button>
          <button type="button" id="flashBtn" disabled>Flash Off</button>
          <button type="button" id="dateBtn" class="on" disabled>Date</button>
        </div>
        <div style="position:relative;justify-self:center">
          <div class="rec-timer" id="recTimer">00:00</div>
          <button type="button" class="shutter" id="shutter" disabled aria-label="Take photo"></button>
        </div>
        <div class="side right">
          <button type="button" class="thumb" id="thumb" hidden aria-label="All captures">
            <img alt="" id="thumbImg">
            <span class="count" id="count">1</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="gate" id="gate">
    <div class="card">
      <h1>Still</h1>
      <p>A paused-tape camera. Soft color, a light tracking bar, date burned into the frame. Grain stays quiet.</p>
      <button type="button" class="go" id="start">Open camera</button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <img id="review" alt="Captured still" hidden>
    <video id="reviewVideo" controls playsinline hidden></video>
    <div class="strip" id="strip"></div>
    <div class="row">
      <button type="button" id="save">Save this</button>
      <button type="button" id="saveAll">Save all</button>
      <button type="button" id="deleteShot" class="danger">Delete</button>
      <button type="button" id="closeReview">Back</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const view = document.getElementById('view');
    const vctx = view.getContext('2d', { alpha: false });
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.autoplay = true;

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true, alpha: false });

    const PRESETS = [
      { id: 'ricoh', name: 'Ricoh', smear: 0.12, soft: 0.04, crisp: 0.62, noise: 1.85, scan: 1, lift: 2, gain: 1.1, vig: 0.08, band: 0, r: 1.01, g: 1.0, b: 0.99, tear: false, bw: false },
      { id: 'ricohbw', name: 'GR B/W', smear: 0.05, soft: 0, crisp: 0.95, noise: 1.85, scan: 1, lift: -8, gain: 1.22, vig: 0.05, band: 0, r: 1, g: 1, b: 1, tear: false, bw: true, contrast: 1.72, filter: 'yellow' },
      { id: 'contax', name: 'Contax T2', smear: 0.42, soft: 0.22, crisp: 0.18, noise: 0.32, scan: 0.992, lift: 5, gain: 1.04, vig: 0.2, band: 0, r: 1.08, g: 1.0, b: 0.9, tear: false, bw: false },
      { id: 'fuji', name: 'Fujifilm', smear: 0.58, soft: 0.4, crisp: 0.06, noise: 0.38, scan: 0.994, lift: 7, gain: 0.98, vig: 0.14, band: 0, r: 1.03, g: 1.07, b: 0.93, tear: false, bw: false },
      { id: 'coolpix', name: 'Coolpix', smear: 0.28, soft: 0.12, crisp: 0.78, noise: 0.35, scan: 0.995, lift: 4, gain: 1.08, vig: 0.1, band: 0, r: 1.06, g: 1.01, b: 0.97, tear: false, bw: false },
      { id: 'polaroid', name: 'Pink Polaroid', smear: 1.35, soft: 0.82, crisp: 0, noise: 0.28, scan: 0.995, lift: 22, gain: 0.9, vig: 0.26, band: 0, r: 1.12, g: 1.0, b: 0.86, tear: false, bw: false }
    ];

    const state = {
      stream: null,
      facing: 'environment',
      running: false,
      dateOn: true,
      flash: 'off',
      torchSupported: false,
      startedAt: 0,
      raf: 0,
      shots: [],
      shotN: 0,
      reviewIndex: 0,
      presetId: 'contax',
      zoom: 1,
      zoomAnim: 1,
      optical: 1,
      hwWide: false,
      holdStill: null,
      holdUntil: 0,
      busy: false,
      queued: 0,
      mode: 'photo',
      starting: false,
      recording: false,
      mediaRecorder: null,
      recordedChunks: [],
      recordStream: null,
      recordTimerId: 0,
      recordStartedAt: 0,
      holdTimer: 0,
      holdTriggered: false,
      shutterArmed: false
    };

    function preset() {
      return PRESETS.find((p) => p.id === state.presetId) || PRESETS[0];
    }

    const buf = {
      y: null, u: null, v: null, tmp: null, y2: null, w: 0, h: 0
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function stampLines(date) {
      const h = date.getHours();
      const m = pad(date.getMinutes());
      const s = pad(date.getSeconds());
      const day = date.getDate();
      const mon = date.getMonth() + 1;
      return [h + ':' + m + ':' + s, day + '. ' + mon + '.' + date.getFullYear()];
    }

    function tapeLabel(ms) {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return 'T-' + pad(m) + ':' + pad(s);
    }

    function ensureBuffers(w, h) {
      const n = w * h;
      if (buf.w === w && buf.h === h) return;
      buf.w = w;
      buf.h = h;
      buf.y = new Float32Array(n);
      buf.u = new Float32Array(n);
      buf.v = new Float32Array(n);
      buf.tmp = new Float32Array(n);
      buf.y2 = new Float32Array(n);
      buf.extra = new Float32Array(n);
    }

    function boxBlurH(src, dst, w, h, r) {
      const inv = 1 / (r * 2 + 1);
      for (let y = 0; y < h; y++) {
        const row = y * w;
        let acc = 0;
        for (let k = -r; k <= r; k++) acc += src[row + Math.max(0, k)];
        for (let x = 0; x < w; x++) {
          dst[row + x] = acc * inv;
          acc -= src[row + Math.max(0, x - r)];
          acc += src[row + Math.min(w - 1, x + r + 1)];
        }
      }
    }

    function boxBlurV(src, dst, w, h, r) {
      const inv = 1 / (r * 2 + 1);
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let k = -r; k <= r; k++) acc += src[Math.max(0, k) * w + x];
        for (let y = 0; y < h; y++) {
          dst[y * w + x] = acc * inv;
          acc -= src[Math.max(0, y - r) * w + x];
          acc += src[Math.min(h - 1, y + r + 1) * w + x];
        }
      }
    }

    function hash(n) {
      n = (n ^ 61) ^ (n >>> 16);
      n = n + (n << 3);
      n = n ^ (n >>> 4);
      n = Math.imul(n, 0x27d4eb2d);
      n = n ^ (n >>> 15);
      return (n >>> 0) / 4294967295;
    }

    function paintStamp(ctx, w, h, date) {
      const lines = stampLines(date);
      const size = Math.max(12, Math.round(h * 0.028));
      ctx.save();
      ctx.font = '500 ' + size + 'px ui-monospace, Menlo, monospace';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(243, 239, 230, 0.55)';
      const x = Math.round(w * 0.045);
      let y = Math.round(h * 0.78);
      lines.forEach((line) => {
        ctx.fillText(line, x, y);
        y += size * 1.28;
      });
      ctx.restore();
    }

    function applyStill(image, w, h, opts) {
      ensureBuffers(w, h);
      const d = image.data;
      const yA = buf.y;
      const uA = buf.u;
      const vA = buf.v;
      const tmp = buf.tmp;
      const y2 = buf.y2;
      const n = w * h;
      const look = opts.look || preset();

      for (let i = 0, p = 0; i < n; i++, p += 4) {
        const r = d[p], g = d[p + 1], b = d[p + 2];
        if (look.bw && look.filter === 'yellow') {
          // GR Hi-Contrast yellow filter: warm tones lift, blues sink
          yA[i] = 0.42 * r + 0.52 * g + 0.06 * b;
        } else {
          yA[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        }
        uA[i] = -0.169 * r - 0.331 * g + 0.5 * b;
        vA[i] = 0.5 * r - 0.419 * g - 0.081 * b;
      }

      const rh = Math.max(0, Math.round((w / 80) * look.smear));
      const rv = Math.max(0, Math.round((h / 140) * look.smear));
      const uBlur = buf.extra;
      if (look.bw) {
        // Keep chroma unused; skip smear work for speed
        uBlur.fill(0);
        tmp.fill(0);
      } else {
        boxBlurH(uA, tmp, w, h, rh);
        boxBlurH(tmp, uA, w, h, rh);
        boxBlurV(uA, uBlur, w, h, rv);
        boxBlurH(vA, tmp, w, h, rh);
        boxBlurH(tmp, vA, w, h, rh);
        boxBlurV(vA, tmp, w, h, rv);
      }
      const vBlur = tmp;

      const lumaBlur = look.bw ? 0 : Math.max(1, Math.round(1 + look.soft * 4));
      boxBlurH(yA, y2, w, h, lumaBlur);
      if (look.soft > 0.5) {
        boxBlurV(y2, tmp, w, h, Math.max(1, Math.round(look.soft * 3)));
        boxBlurH(tmp, y2, w, h, Math.max(1, Math.round(look.soft * 2)));
      }

      const shift = look.bw ? 0 : Math.max(1, Math.round(w * 0.004 * look.smear));
      const band = look.band <= 0 ? 0 : Math.max(4, Math.round(h * look.band));
      const bandTop = h - band;
      const live = opts.live;
      const seed = (opts.seed || 1) | 0;
      const contrast = look.contrast || 1;

      for (let y = 0; y < h; y++) {
        const row = y * w;
        const above = Math.max(0, y - 1) * w;
        const below = Math.min(h - 1, y + 1) * w;
        const scan = (y & 1) ? look.scan : 1;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          const sharpLuma = yA[i];
          const softLuma = y2[i] * 0.7 + yA[above + x] * 0.15 + yA[below + x] * 0.15;
          let luma = sharpLuma * (1 - look.soft) + softLuma * look.soft;
          if (look.crisp) luma += (sharpLuma - y2[i]) * look.crisp;
          luma *= scan;

          const cx = Math.min(w - 1, Math.max(0, x - shift));
          let U = look.bw ? 0 : uBlur[row + cx];
          let V = look.bw ? 0 : vBlur[row + cx];

          const nx = (x / (w - 1)) * 2 - 1;
          const ny = (y / (h - 1)) * 2 - 1;
          const vig = 1 - look.vig * (nx * nx * 0.85 + ny * ny);
          luma *= vig;

          const noiseAmt = look.noise >= 1.5 ? (live ? 7.2 : 9.5) : (live ? 3.2 : 4.0);
          const noise = (hash(i * 13 + seed) - 0.5) * noiseAmt * look.noise;
          luma += noise * (0.55 + (1 - luma / 255) * 0.45);

          if (band > 0 && y >= bandTop) {
            const t = (y - bandTop) / band;
            const smearX = Math.max(0, x - 3);
            luma = luma * (1 - t * 0.35) + y2[row + smearX] * (t * 0.22);
            luma += (hash(y * 92821 + seed) - 0.5) * 10 * t;
            U *= 1 - t * 0.45;
            V *= 1 - t * 0.45;
          }

          let Y = luma * look.gain + look.lift;
          if (contrast !== 1) {
            // Hard S-curve — GR Hi-Contrast: crushed blacks, hard whites
            const t = Math.min(1, Math.max(0, Y / 255));
            const shaped = t < 0.5
              ? 0.5 * Math.pow(t * 2, contrast)
              : 1 - 0.5 * Math.pow((1 - t) * 2, contrast);
            Y = shaped * 255;
            // Extra black crush / highlight push for GR HC
            if (look.bw) {
              Y = (Y - 128) * 1.18 + 128;
              if (Y < 18) Y *= Y / 18;
              if (Y > 235) Y = 235 + (Y - 235) * 0.35;
            }
          }
          if (Y < 0) Y = 0;
          if (Y > 255) Y = 255;

          let r = Y + 1.402 * V;
          let g = Y - 0.344 * U - 0.714 * V;
          let b = Y + 1.772 * U;

          if (look.bw) {
            r = g = b = Y;
          } else {
            r = r * look.r + 6;
            g = g * look.g + 4;
            b = b * look.b + 7;
          }

          const p = i * 4;
          d[p] = r < 0 ? 0 : r > 255 ? 255 : r;
          d[p + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
          d[p + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
          d[p + 3] = 255;
        }
      }

      const doTear = look.tear && (live ? (seed % 70) === 0 : true);
      if (!doTear) return;
      const tearY = (seed % (h - 8));
      if (live || (seed % 3) === 0) {
        for (let y = tearY; y < tearY + 2 && y < h; y++) {
          const row = y * w * 4;
          const next = d.slice(row, row + w * 4);
          const slip = 2;
          for (let x = 0; x < w; x++) {
            const src = Math.max(0, x - slip) * 4;
            const dst = row + x * 4;
            d[dst] = next[src];
            d[dst + 1] = next[src + 1];
            d[dst + 2] = next[src + 2];
          }
        }
      }
    }

    function frameSize(forCapture) {
      const rect = view.getBoundingClientRect();
      const cssW = Math.max(2, rect.width);
      const cssH = Math.max(2, rect.height);
      const longEdge = forCapture ? 1280 : 760;
      let w, h;
      if (cssW >= cssH) {
        w = longEdge;
        h = Math.round(longEdge * (cssH / cssW));
      } else {
        h = longEdge;
        w = Math.round(longEdge * (cssW / cssH));
      }
      w -= w & 1;
      h -= h & 1;
      return { w: Math.max(2, w), h: Math.max(2, h) };
    }

    function drawMirrored(ctx, src, sx, sy, sw, sh, dx, dy, dw, dh, w) {
      ctx.save();
      if (state.facing === 'user') {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(src, sx, sy, sw, sh, -dx - dw, dy, dw, dh);
      } else {
        ctx.drawImage(src, sx, sy, sw, sh, dx, dy, dw, dh);
      }
      ctx.restore();
    }

    function digitalZoom() {
      if (state.zoom < 0.75) return 1;
      const optical = state.optical > 1.01 ? state.optical : 1;
      return Math.max(1, state.zoom / optical);
    }

    function drawVideoCover(ctx, w, h) {
      const vw = video.videoWidth || 4;
      const vh = video.videoHeight || 3;
      const target = digitalZoom();
      state.zoomAnim += (target - state.zoomAnim) * 0.22;
      if (Math.abs(state.zoomAnim - target) < 0.004) state.zoomAnim = target;
      const factor = Math.max(1, state.zoomAnim);
      const destAspect = w / h;
      const videoAspect = vw / vh;
      let cw;
      let ch;
      if (videoAspect > destAspect) {
        ch = vh / factor;
        cw = ch * destAspect;
      } else {
        cw = vw / factor;
        ch = cw / destAspect;
      }
      cw = Math.min(vw, cw);
      ch = Math.min(vh, ch);
      const sx = (vw - cw) * 0.5;
      const sy = (vh - ch) * 0.5;
      ctx.fillStyle = '#070605';
      ctx.fillRect(0, 0, w, h);
      drawMirrored(ctx, video, sx, sy, cw, ch, 0, 0, w, h, w);
    }

    function renderFrame(forCapture, opts) {
      opts = opts || {};
      const size = frameSize(forCapture);
      if (work.width !== size.w || work.height !== size.h) {
        work.width = size.w;
        work.height = size.h;
      }
      wctx.imageSmoothingEnabled = true;
      if (state.running && video.readyState >= 2) {
        drawVideoCover(wctx, size.w, size.h);
      }
      if (state.dateOn) paintStamp(wctx, size.w, size.h, new Date());
      const image = wctx.getImageData(0, 0, size.w, size.h);
      if (opts.fillFlash) applyFillFlash(image);
      applyStill(image, size.w, size.h, {
        live: !forCapture,
        seed: (Date.now() / 80) | 0
      });
      wctx.putImageData(image, 0, 0);
      return work;
    }

    function paintView(source) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = view.getBoundingClientRect();
      const pw = Math.max(2, Math.round(rect.width * dpr));
      const ph = Math.max(2, Math.round(rect.height * dpr));
      if (view.width !== pw || view.height !== ph) {
        view.width = pw;
        view.height = ph;
      }
      vctx.imageSmoothingEnabled = true;
      vctx.imageSmoothingQuality = 'medium';
      vctx.drawImage(source, 0, 0, pw, ph);
    }

    function demoPlate() {
      const size = frameSize(false);
      work.width = size.w;
      work.height = size.h;
      const g = wctx.createLinearGradient(0, 0, size.w, size.h);
      g.addColorStop(0, '#6d8cae');
      g.addColorStop(0.45, '#d7c2a4');
      g.addColorStop(1, '#8d4d45');
      wctx.fillStyle = g;
      wctx.fillRect(0, 0, size.w, size.h);
      wctx.fillStyle = '#1c2430';
      wctx.fillRect(size.w * 0.12, size.h * 0.18, size.w * 0.34, size.h * 0.46);
      wctx.fillStyle = '#e7d7bf';
      wctx.fillRect(size.w * 0.16, size.h * 0.23, size.w * 0.11, size.h * 0.16);
      wctx.fillStyle = '#c4553a';
      wctx.beginPath();
      wctx.arc(size.w * 0.72, size.h * 0.42, size.w * 0.11, 0, Math.PI * 2);
      wctx.fill();
      wctx.fillStyle = '#2a241c';
      wctx.fillRect(0, size.h * 0.72, size.w, size.h * 0.28);
      if (state.dateOn) paintStamp(wctx, size.w, size.h, new Date());
      const image = wctx.getImageData(0, 0, size.w, size.h);
      applyStill(image, size.w, size.h, { live: false, seed: 4 });
      wctx.putImageData(image, 0, 0);
      paintView(work);
    }

    function loop() {
      if (!state.running) return;
      const now = performance.now();
      document.getElementById('clock').textContent = stampLines(new Date())[0];
      document.getElementById('tape').textContent = tapeLabel(now - state.startedAt);
      if (now < state.holdUntil && state.holdStill) {
        paintView(state.holdStill);
      } else if (video.readyState >= 2) {
        paintView(renderFrame(false));
      }
      state.raf = requestAnimationFrame(loop);
    }

    async function getStream() {
      const attempts = [
        {
          audio: false,
          video: {
            facingMode: { exact: state.facing },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30, max: 30 }
          }
        },
        {
          audio: false,
          video: {
            facingMode: { ideal: state.facing },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30, max: 30 }
          }
        },
        {
          audio: false,
          video: {
            facingMode: state.facing,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        { audio: false, video: true }
      ];
      let lastErr = null;
      for (let i = 0; i < attempts.length; i++) {
        try {
          return await navigator.mediaDevices.getUserMedia(attempts[i]);
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('getUserMedia failed');
    }

    function stopStreamOnly() {
      if (state.stream) {
        state.stream.getTracks().forEach((t) => {
          try { t.stop(); } catch (e) { /* ignore */ }
        });
        state.stream = null;
      }
      video.srcObject = null;
    }

    async function startCamera() {
      if (state.starting) return;
      state.starting = true;
      try {
        if (state.recording) requestStopRecording();
        state.running = false;
        stopStreamOnly();
        const stream = await getStream();
        state.stream = stream;
        video.srcObject = stream;
        await video.play();
        if (!video.videoWidth) {
          await new Promise((resolve) => {
            const done = () => {
              video.removeEventListener('loadeddata', done);
              resolve();
            };
            video.addEventListener('loadeddata', done);
            setTimeout(resolve, 800);
          });
        }
        await syncLens();
        probeTorch();
        state.running = true;
        state.startedAt = performance.now();
        document.body.classList.add('is-live');
        document.getElementById('shutter').disabled = false;
        document.getElementById('flip').disabled = false;
        document.getElementById('flashBtn').disabled = false;
        document.getElementById('dateBtn').disabled = false;
        document.querySelectorAll('#zoom button').forEach((btn) => { btn.disabled = false; });
        document.querySelectorAll('#modeToggle button').forEach((btn) => { btn.disabled = false; });
        cancelAnimationFrame(state.raf);
        loop();
        toast(state.facing === 'user' ? 'Front camera' : 'Rear camera');
      } finally {
        state.starting = false;
      }
    }

    async function flipCamera() {
      if (!state.running || state.starting || state.recording) return;
      state.facing = state.facing === 'environment' ? 'user' : 'environment';
      toast('Switching…');
      try {
        await startCamera();
      } catch (err) {
        state.facing = state.facing === 'environment' ? 'user' : 'environment';
        toast('Could not flip');
        console.warn(err);
      }
    }

    async function setTorch(on) {
      const track = state.stream && state.stream.getVideoTracks()[0];
      if (!track || !track.applyConstraints) return false;
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (!caps.torch) return false;
        await track.applyConstraints({ advanced: [{ torch: !!on }] });
        return true;
      } catch (err) {
        return false;
      }
    }

    function probeTorch() {
      const track = state.stream && state.stream.getVideoTracks()[0];
      state.torchSupported = !!(track && track.getCapabilities && track.getCapabilities().torch);
      syncFlashUi();
    }

    function syncFlashUi() {
      const btn = document.getElementById('flashBtn');
      if (!btn) return;
      const labels = { off: 'Flash Off', on: 'Flash On', auto: 'Flash Auto' };
      btn.textContent = labels[state.flash] || 'Flash Off';
      btn.classList.toggle('on', state.flash !== 'off');
    }

    function shouldFireFlash() {
      if (state.flash === 'on') return true;
      if (state.flash === 'auto') {
        // Fire when the live frame is dim
        try {
          const sample = document.createElement('canvas');
          sample.width = 32;
          sample.height = 18;
          const sctx = sample.getContext('2d', { willReadFrequently: true });
          sctx.drawImage(video, 0, 0, 32, 18);
          const data = sctx.getImageData(0, 0, 32, 18).data;
          let sum = 0;
          for (let i = 0; i < data.length; i += 4) {
            sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }
          return (sum / (data.length / 4)) < 72;
        } catch (err) {
          return false;
        }
      }
      return false;
    }

    function applyFillFlash(image) {
      const d = image.data;
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * 1.18 + 18);
        d[i + 1] = Math.min(255, d[i + 1] * 1.15 + 14);
        d[i + 2] = Math.min(255, d[i + 2] * 1.1 + 10);
      }
    }

    async function syncLens() {
      const track = state.stream && state.stream.getVideoTracks()[0];
      state.hwWide = false;
      state.optical = 1;
      if (!track || !track.getCapabilities || !track.applyConstraints) return;
      const caps = track.getCapabilities();
      if (!caps.zoom) return;
      const wide = caps.zoom.min;
      let want = 1;
      if (state.zoom < 0.75) want = wide;
      else want = Math.min(caps.zoom.max, Math.max(wide, state.zoom));
      try {
        await track.applyConstraints({ advanced: [{ zoom: want }] });
        const applied = track.getSettings && track.getSettings().zoom;
        state.optical = typeof applied === 'number' ? applied : want;
        state.hwWide = state.zoom < 0.75 && wide < 0.95;
      } catch (err) {
        state.hwWide = false;
        state.optical = 1;
      }
    }

    function clickSound() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!clickSound.ctx) clickSound.ctx = new AC();
      const ctx = clickSound.ctx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(210, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    }

    function pushShot(blob, kind, nameHint) {
      const when = new Date();
      state.shotN += 1;
      const isVideo = kind === 'video';
      const ext = isVideo
        ? (blob.type.indexOf('webm') !== -1 ? 'webm' : 'mp4')
        : 'jpg';
      const stamp = when.getFullYear() + pad(when.getMonth() + 1) + pad(when.getDate()) + '-' + pad(when.getHours()) + pad(when.getMinutes()) + pad(when.getSeconds()) + '-' + pad(state.shotN);
      const name = nameHint || ((isVideo ? 'still-vid-' : 'still-') + stamp + '.' + ext);
      const url = URL.createObjectURL(blob);
      const shot = {
        blob,
        url,
        name,
        kind: isVideo ? 'video' : 'photo',
        type: blob.type || (isVideo ? 'video/mp4' : 'image/jpeg')
      };
      state.shots.push(shot);
      updateThumb();
      if (document.body.classList.contains('reviewing')) showReview(state.shots.length - 1);
      return shot;
    }

    function updateThumb() {
      const thumb = document.getElementById('thumb');
      const count = document.getElementById('count');
      if (!state.shots.length) {
        thumb.hidden = true;
        count.textContent = '0';
        return;
      }
      const last = state.shots[state.shots.length - 1];
      document.getElementById('thumbImg').src = last.kind === 'video' ? last.url : last.url;
      count.textContent = String(state.shots.length);
      thumb.hidden = false;
    }

    async function captureOne() {
      const fire = shouldFireFlash();
      let torchOn = false;
      if (fire && state.facing === 'environment') {
        torchOn = await setTorch(true);
        if (torchOn) await new Promise((r) => setTimeout(r, 90));
      }
      const flash = document.getElementById('flash');
      flash.classList.remove('pop', 'pop-strong');
      void flash.offsetWidth;
      flash.classList.add(fire ? 'pop-strong' : 'pop');
      clickSound();
      const shot = renderFrame(true, { fillFlash: fire });
      if (torchOn) await setTorch(false);
      const copy = document.createElement('canvas');
      copy.width = shot.width;
      copy.height = shot.height;
      copy.getContext('2d').drawImage(shot, 0, 0);
      state.holdStill = copy;
      state.holdUntil = performance.now() + 140;
      const blob = await new Promise((resolve) => copy.toBlob(resolve, 'image/jpeg', 0.88));
      if (!blob) {
        toast('Could not keep frame');
        return;
      }
      pushShot(blob, 'photo');
    }

    async function takePhoto() {
      if (!state.running || video.readyState < 2 || state.recording) return;
      if (state.busy) {
        state.queued = Math.min(12, state.queued + 1);
        return;
      }
      state.busy = true;
      try {
        do {
          await captureOne();
          if (state.queued > 0) state.queued -= 1;
          else break;
        } while (state.running);
      } finally {
        state.busy = false;
      }
    }

    function setCaptureMode(mode) {
      state.mode = mode === 'video' ? 'video' : 'photo';
      document.body.classList.toggle('mode-video', state.mode === 'video');
      document.querySelectorAll('#modeToggle button').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-mode') === state.mode);
      });
    }

    function formatRecTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return pad(m) + ':' + pad(sec);
    }

    function pickRecorderMime() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
      for (let i = 0; i < types.length; i++) {
        if (MediaRecorder.isTypeSupported(types[i])) return types[i];
      }
      return '';
    }

    function stopRecordStream() {
      if (state.recordStream) {
        state.recordStream.getTracks().forEach((t) => {
          try { t.stop(); } catch (e) { /* */ }
        });
        state.recordStream = null;
      }
    }

    function startRecordTimer() {
      state.recordStartedAt = Date.now();
      document.getElementById('recTimer').textContent = '00:00';
      clearInterval(state.recordTimerId);
      state.recordTimerId = setInterval(() => {
        document.getElementById('recTimer').textContent = formatRecTime(Date.now() - state.recordStartedAt);
      }, 250);
    }

    function stopRecordTimer() {
      clearInterval(state.recordTimerId);
      state.recordTimerId = 0;
    }

    async function startRecording() {
      if (!state.running || state.recording || !view.width) {
        toast('Camera not ready');
        return;
      }
      if (!window.MediaRecorder) {
        toast('Recording not supported');
        return;
      }
      state.recordedChunks = [];
      const mime = pickRecorderMime();
      let canvasStream;
      try {
        canvasStream = view.captureStream(30);
      } catch (err) {
        toast('Could not capture video');
        return;
      }
      stopRecordStream();
      state.recordStream = new MediaStream();
      canvasStream.getVideoTracks().forEach((t) => state.recordStream.addTrack(t));
      try {
        const opts = { videoBitsPerSecond: 6000000 };
        if (mime) opts.mimeType = mime;
        state.mediaRecorder = new MediaRecorder(state.recordStream, opts);
      } catch (err) {
        try {
          state.mediaRecorder = mime
            ? new MediaRecorder(state.recordStream, { mimeType: mime })
            : new MediaRecorder(state.recordStream);
        } catch (err2) {
          stopRecordStream();
          toast('Could not start recorder');
          return;
        }
      }
      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) state.recordedChunks.push(e.data);
      };
      state.mediaRecorder.onerror = () => {
        toast('Recording error');
        finishRecording(true);
      };
      state.mediaRecorder.onstop = () => finishRecording(false);
      try {
        state.mediaRecorder.start(250);
      } catch (err) {
        stopRecordStream();
        toast('Could not start recording');
        return;
      }
      state.recording = true;
      document.body.classList.add('is-recording');
      document.getElementById('shutter').classList.add('recording');
      startRecordTimer();
      toast('Recording…');
    }

    function requestStopRecording() {
      if (!state.recording || !state.mediaRecorder) return;
      try {
        if (state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop();
      } catch (err) {
        finishRecording(true);
      }
    }

    function finishRecording(aborted) {
      if (!state.recording && !state.mediaRecorder) {
        stopRecordStream();
        return;
      }
      state.recording = false;
      document.body.classList.remove('is-recording');
      document.getElementById('shutter').classList.remove('recording');
      stopRecordTimer();
      const chunks = state.recordedChunks.slice();
      const mime = (state.mediaRecorder && state.mediaRecorder.mimeType) || 'video/mp4';
      state.mediaRecorder = null;
      state.recordedChunks = [];
      stopRecordStream();
      if (aborted || !chunks.length) {
        toast('Recording cancelled');
        return;
      }
      const blob = new Blob(chunks, { type: mime });
      pushShot(blob, 'video');
      toast('Video kept');
    }

    function onShutterDown(e) {
      if (!state.running || state.starting) return;
      e.preventDefault();
      state.shutterArmed = true;
      state.holdTriggered = false;
      clearTimeout(state.holdTimer);
      state.holdTimer = setTimeout(() => {
        if (!state.shutterArmed || state.recording) return;
        state.holdTriggered = true;
        startRecording();
      }, state.mode === 'video' ? 180 : 420);
    }

    function onShutterUp(e) {
      if (!state.shutterArmed) return;
      e.preventDefault();
      state.shutterArmed = false;
      clearTimeout(state.holdTimer);
      state.holdTimer = 0;
      if (state.recording) {
        requestStopRecording();
        return;
      }
      if (state.holdTriggered) return;
      if (state.mode === 'video') startRecording();
      else takePhoto();
    }

    async function shareFiles(files) {
      try {
        if (navigator.canShare && navigator.canShare({ files })) {
          await navigator.share({ files, title: 'STILL' });
          return true;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return true;
      }
      files.forEach((file, i) => {
        const shot = state.shots.find((s) => s.name === file.name);
        if (!shot) return;
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = shot.url;
          a.download = shot.name;
          a.click();
        }, i * 250);
      });
      toast(files.length > 1 ? 'Downloading ' + files.length : 'Downloaded');
      return false;
    }

    function fileFor(shot) {
      return new File([shot.blob], shot.name, { type: shot.type });
    }

    function saveShot() {
      const shot = state.shots[state.reviewIndex];
      if (!shot) return;
      shareFiles([fileFor(shot)]);
    }

    function saveAll() {
      if (!state.shots.length) return;
      shareFiles(state.shots.map(fileFor));
    }

    function deleteShot() {
      const shot = state.shots[state.reviewIndex];
      if (!shot) return;
      URL.revokeObjectURL(shot.url);
      state.shots.splice(state.reviewIndex, 1);
      updateThumb();
      if (!state.shots.length) {
        document.body.classList.remove('reviewing');
        const rv = document.getElementById('reviewVideo');
        rv.pause();
        rv.removeAttribute('src');
        toast('Deleted');
        return;
      }
      showReview(Math.min(state.reviewIndex, state.shots.length - 1));
      toast('Deleted');
    }

    function showReview(index) {
      if (!state.shots.length) return;
      state.reviewIndex = Math.max(0, Math.min(state.shots.length - 1, index));
      const shot = state.shots[state.reviewIndex];
      const img = document.getElementById('review');
      const vid = document.getElementById('reviewVideo');
      if (shot.kind === 'video') {
        img.hidden = true;
        vid.hidden = false;
        if (vid.src !== shot.url) {
          vid.src = shot.url;
        }
      } else {
        vid.pause();
        vid.hidden = true;
        img.hidden = false;
        img.src = shot.url;
      }
      const strip = document.getElementById('strip');
      strip.replaceChildren();
      state.shots.forEach((item, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        if (i === state.reviewIndex) btn.classList.add('active');
        if (item.kind === 'video') btn.classList.add('vid');
        const thumb = document.createElement(item.kind === 'video' ? 'video' : 'img');
        thumb.src = item.url;
        thumb.alt = '';
        if (item.kind === 'video') {
          thumb.muted = true;
          thumb.playsInline = true;
          thumb.preload = 'metadata';
        }
        btn.appendChild(thumb);
        btn.addEventListener('click', () => showReview(i));
        strip.appendChild(btn);
      });
      document.body.classList.add('reviewing');
    }

    document.getElementById('start').addEventListener('click', async () => {
      const btn = document.getElementById('start');
      btn.disabled = true;
      try {
        await startCamera();
      } catch (err) {
        btn.disabled = false;
        toast('Camera blocked');
        console.warn(err);
      }
    });

    const shutter = document.getElementById('shutter');
    shutter.addEventListener('pointerdown', onShutterDown);
    shutter.addEventListener('pointerup', onShutterUp);
    shutter.addEventListener('pointercancel', onShutterUp);
    shutter.addEventListener('pointerleave', (e) => {
      if (state.shutterArmed) onShutterUp(e);
    });

    document.getElementById('flip').addEventListener('click', flipCamera);
    document.getElementById('flashBtn').addEventListener('click', () => {
      const order = ['off', 'on', 'auto'];
      const i = order.indexOf(state.flash);
      state.flash = order[(i + 1) % order.length];
      syncFlashUi();
      toast(state.flash === 'off' ? 'Flash off' : state.flash === 'on' ? 'Flash on' : 'Flash auto');
    });
    document.getElementById('dateBtn').addEventListener('click', () => {
      state.dateOn = !state.dateOn;
      document.getElementById('dateBtn').classList.toggle('on', state.dateOn);
    });
    syncFlashUi();
    document.getElementById('modeToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-mode]');
      if (!btn || btn.disabled) return;
      if (state.recording) return;
      setCaptureMode(btn.getAttribute('data-mode'));
    });
    document.getElementById('thumb').addEventListener('click', () => showReview(state.shots.length - 1));
    document.getElementById('save').addEventListener('click', saveShot);
    document.getElementById('saveAll').addEventListener('click', saveAll);
    document.getElementById('deleteShot').addEventListener('click', deleteShot);
    document.getElementById('closeReview').addEventListener('click', () => {
      document.getElementById('reviewVideo').pause();
      document.body.classList.remove('reviewing');
    });

    const presetBar = document.getElementById('presets');
    PRESETS.forEach((look) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = look.name;
      btn.classList.toggle('active', look.id === state.presetId);
      btn.addEventListener('click', () => {
        state.presetId = look.id;
        presetBar.querySelectorAll('button').forEach((el) => {
          el.classList.toggle('active', el === btn);
        });
        toast(look.name);
        if (!state.running) demoPlate();
      });
      presetBar.appendChild(btn);
    });

    document.getElementById('zoom').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-zoom]');
      if (!btn || btn.disabled) return;
      state.zoom = +btn.getAttribute('data-zoom');
      document.querySelectorAll('#zoom button').forEach((el) => {
        el.classList.toggle('active', el === btn);
      });
      await syncLens();
      if (state.zoom < 0.75) toast(state.hwWide ? '13mm ultra-wide' : '13mm · widest frame');
      else toast(state.zoom + '×');
    });

    window.addEventListener('resize', () => {
      if (!state.running) demoPlate();
    });

    setCaptureMode('photo');
    demoPlate();
  </script>
</body>
</html>
