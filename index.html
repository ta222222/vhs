  <title>☆ hammer mag ☆</title>

  <script>
  window.applyHammerTheme = window.applyHammerTheme || function () {};
  window.bootHammerTheme = window.bootHammerTheme || function (modes, fallback) { applyHammerTheme(fallback); return fallback; };
  window.syncHammerBodyMode = window.syncHammerBodyMode || function (modes, fallback) { return bootHammerTheme(modes, fallback); };
  window.fillHammerDatetime = window.fillHammerDatetime || function () {};

  <script>
  // Pick heated/normal before first paint and lock it for this load
  (function () {
    var mode = Math.random() < 0.5 ? 'heated' : 'normal';
    window.__homeMode = mode;
    localStorage.setItem('mode', mode);
    applyHammerTheme(mode);
    document.documentElement.style.backgroundColor = mode === 'heated' ? '#ff0000' : '#ffffff';
  })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, p, a {
      font-family: Helvetica Neue, sans-serif;
      margin: 0;
      padding: 0;
      font-size: 0.75rem;
      line-height: 1.75em;
      color: inherit;
      text-decoration: none;
      text-transform: uppercase;
    }

    body.normal {
      background-color: white;
      color: black;
    }

    body.heated {
      background-color: red;
      color: white;
    }

    html:has(body.normal) {
      background-color: #ffffff;
    }

    html:has(body.heated) {
      background-color: #ff0000;
    }

    nav {
      padding: 1.5em 1.5em 1em;
      display: flex;
      align-items: center;
      gap: 0.75em;
      margin-bottom: 2em;
      position: sticky;
      top: 0;
      background-color: inherit;
      z-index: 10;
    }

    nav a,
    #datetime,
    #modeToggleLink {
      flex: 0 0 auto;
      line-height: 2;
      white-space: nowrap;
    }

    nav a[aria-current="page"] {
      font-weight: 700;
    }

    body.normal nav {
      background-color: white;
    }

    body.heated nav {
      background-color: red;
    }

    .container {
      max-width: 100vw;
      padding: 0 1.5em;
    }

    .latest {
      font-size: 0.75rem;
      margin-bottom: 0.625rem;
      text-transform: uppercase;
    }

    /* Unified headline styles */
    .headline {
      margin: 1.25rem 0;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: -0.0625rem;
      line-height: 1.75em;
      display: none; /* Start hidden */
      font-size: 2rem;
    }

    .getintouch-mobile {
      display: none;
    }

    .getintouch-desktop {
      display: inline;
    }

    /* Blink animation keyframes */
    @keyframes blink {
      from, to {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    /* Keep blinking animation always active for the star headline */
    .headline.star {
      animation: blink 0.333s step-end infinite;
    }

    /* When hovering over the star headline, stop the blinking animation */
    .headline.star:hover {
      animation: none;
    }

    /* Intro overlay: full-screen blinking devil — covers page until theme + intro are ready */
    #introOverlay {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
    }

    body.heated #introOverlay {
      background-color: #ff0000;
    }

    body.heated .intro-devil {
      filter: brightness(0) invert(1);
    }

    #introOverlay.is-done {
      display: none;
    }

    /* Keep real page hidden until mode is applied and intro finishes */
    body:not(.is-ready) nav,
    body:not(.is-ready) .container,
    body:not(.is-ready) .footer {
      visibility: hidden;
    }

    .intro-devil {
      width: auto;
      height: auto;
      /* desktop/ipad: 75% of the original size, nudged up ~0.5in (3rem) */
      max-width: min(45vw, 240px);
      max-height: 52.5vh;
      transform: translateY(-3rem);
      pointer-events: none;
      animation: blink 0.333s step-end infinite;
    }

    #mysteryVideo {
      cursor: pointer;
    }

    /* Minimal custom video player overlay */

      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1.5em;
      background: rgba(0, 0, 0, 0.72);
    }

    .video-overlay.open {

    }

    .video-box {

      max-width: min(100%, 60rem);
      display: inline-flex;
      flex-direction: column;
      gap: 0.75em;

    .video-el {

      height: auto;

      background: transparent;

      padding: 0.35em 0.9em;

    .video-title-credit {
      opacity: 0;
      pointer-events: none;

    }

    .video-title:hover .video-title-credit {
      opacity: 0.6;
    }

    /* Diamonds image modal (mystery) */
    .diamonds-overlay {
      display: none;

      align-items: center;
      justify-content: center;

    }

    .diamonds-overlay.open {

    }

    .diamonds-box {

    }

    .diamonds-x {

    /* Fashion text modal */
    .fashion-overlay {

      align-items: center;

    }

    .fashion-overlay.open {

    .fashion-word {

    .fashion-word strong {

    /* No Stylist lyrics modal — imprint-style panel over dimmed page */
    .lyrics-overlay {

    .lyrics-overlay.open {

    }

    .lyrics-shell {
      position: relative;
      width: min(100%, 64rem);
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }

    .lyrics-heading {
      margin: 0;
      color: #b0b0b0;
      font-family: "Helvetica Neue", sans-serif;
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: none;
      text-align: left;
      flex: 0 0 auto;
    }

    body.heated .lyrics-heading,
    body.dark .lyrics-heading {
      color: #b0b0b0;
    }

    .lyrics-x {
      align-self: flex-end;
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      font-family: "Helvetica Neue", sans-serif;
      font-size: 0.75rem;
      line-height: 1.75em;
      text-transform: uppercase;
      padding: 0.35em 0.65em;
      cursor: pointer;
    }

    .lyrics-x:hover {
      opacity: 0.6;
    }

    .lyrics-box {
      position: relative;
      width: 100%;
      max-height: min(90vh, 48rem);
      overflow-y: auto;
      border: 1px solid currentColor;
      padding: 2.25em 1.75em;
      display: flex;
      flex-direction: column;
      gap: 1em;
      text-align: left;
      font-family: "Helvetica Neue", sans-serif;
    }

    .lyrics-scroll {
      overflow: visible;
      flex: 1;
      min-height: 0;
    }

    .lyrics-columns {
      display: block;
    }

    .lyrics-text,
    .lyrics-overlay .lyrics-text {
      margin: 0;
      padding: 0;
      color: inherit;
      font-family: "Helvetica Neue", sans-serif;
      font-size: 1.125rem;
      line-height: 1.55;
      text-transform: none;
      white-space: pre-line;
      text-align: left;
      font-weight: 700;
    }

    .lyrics-text--mobile .lyrics-line,
    .lyrics-text--left .lyrics-line,
    .lyrics-text--right .lyrics-line {
      display: block;
      font-weight: 400;
      opacity: 0.35;
      transition: opacity 0.9s ease;
    }

    .lyrics-text--mobile .lyrics-line.is-sung,
    .lyrics-text--left .lyrics-line.is-sung,
    .lyrics-text--right .lyrics-line.is-sung {
      font-weight: 700;
      opacity: 1;
    }

    .lyrics-text--mobile .lyrics-line--blank,
    .lyrics-text--left .lyrics-line--blank,
    .lyrics-text--right .lyrics-line--blank {
      min-height: 1.75em;
      opacity: 0;
    }

    .lyrics-text--mobile .lyrics-line--blank.is-sung,
    .lyrics-text--left .lyrics-line--blank.is-sung,
    .lyrics-text--right .lyrics-line--blank.is-sung {
      opacity: 0;
      font-weight: 400;
    }

    @media only screen and (min-width: 768px) {
      .lyrics-shell {
        width: min(92vw, 72rem);
      }

      .lyrics-box {
        max-height: min(90vh, 52rem);
        overflow: hidden;
      }

      .lyrics-scroll {
        overflow: hidden;
      }

      .lyrics-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.5em;
        align-items: start;
      }

      .lyrics-text,
      .lyrics-overlay .lyrics-text {
        font-size: 0.95rem;
        line-height: 1.4;
        white-space: normal;
      }

      .lyrics-text--mobile {
        display: none;
      }
    }

    @media only screen and (max-width: 767px) {
      .lyrics-shell {
        width: min(85%, 28.9rem);
      }

      .lyrics-box {
        max-height: min(76.5vh, 37.4rem);
        padding: 2.25em 1.75em;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .lyrics-scroll {
        overflow: visible;
      }

      .lyrics-heading {
        font-size: 0.8rem;
      }

      .lyrics-text,
      .lyrics-overlay .lyrics-text {
        font-size: 0.75rem;
        line-height: 1.75em;
        font-weight: 400;
        white-space: normal;
      }

      .lyrics-overlay .lyrics-text.lyrics-text--mobile {
        display: block;
        padding-bottom: 4em;
      }

      .lyrics-text--mobile .lyrics-line {
        display: block;
        font-weight: 400;
        opacity: 0.35;
        transition: opacity 0.9s ease;
      }

      .lyrics-text--mobile .lyrics-line.is-sung {
        font-weight: 700;
        opacity: 1;
      }

      .lyrics-text--mobile .lyrics-line--blank {
        min-height: 1.75em;
        opacity: 0;
      }

      .lyrics-text--mobile .lyrics-line--blank.is-sung {
        opacity: 0;
        font-weight: 400;
      }

      .lyrics-text--left,
      .lyrics-text--right {
        display: none;
      }
    }

    /* Responsive styles for mobile */
    @media only screen and (max-width: 767px) {
      .video-overlay {
        padding: max(0.75em, env(safe-area-inset-top)) max(0.75em, env(safe-area-inset-right)) max(0.75em, env(safe-area-inset-bottom)) max(0.75em, env(safe-area-inset-left));
        align-items: center;
        justify-content: center;
      }

      .video-box {
        width: auto;
        max-width: 100%;
        max-height: 100%;

      }

<body>
  <script>
    (function applyHomeModeNow() {
      var mode = window.__homeMode || (localStorage.getItem('mode') === 'heated' ? 'heated' : 'normal');
      window.__homeMode = mode;
      document.body.classList.remove('normal', 'heated', 'is-ready');
      document.body.classList.add(mode);
      localStorage.setItem('mode', mode);
      applyHammerTheme(mode);
    })();
  </script>
  <div id="introOverlay" aria-hidden="false">
    <img class="intro-devil" src="pix/hot-stuff-devil.png" alt="" />
  </div>
  <script>
    // Paint overlay to match mode immediately (don't wait on CSS cascade)
    (function paintIntro() {
      var mode = window.__homeMode || 'normal';
      var overlay = document.getElementById('introOverlay');
      var devil = overlay && overlay.querySelector('.intro-devil');
      if (overlay) {
        overlay.style.backgroundColor = mode === 'heated' ? '#ff0000' : '#ffffff';
      }
      if (devil) {
        devil.style.filter = mode === 'heated' ? 'brightness(0) invert(1)' : 'none';
      }
    })();
  </script>

  <nav>
    <a href="/" class="navbar-link" aria-current="page">home</a>
    <a href="/news" class="navbar-link">news</a>
    <div id="datetime"></div>
    <a href="#" id="modeToggleLink">normal mode</a>
  </nav>
  <script>
    (function syncHomeChrome() {
      var mode = window.__homeMode || 'normal';
      var toggle = document.getElementById('modeToggleLink');
      if (toggle) toggle.textContent = mode === 'heated' ? 'heated mode' : 'normal mode';
      fillHammerDatetime();
    })();
  </script>
  <div class="container">
    <h1 class="headline">
      <span class="please" onclick="window.location.href='/about'">ABOUT</span>
    </h1>
    <h1 class="headline">
      <!-- temporarily inaccessible: <span onclick="window.location.href='/buy.html'">BUY HAMMER</span> -->

    function pickRandomLyricsSong() {
      return LYRICS_SONGS[Math.floor(Math.random() * LYRICS_SONGS.length)];

    function splitLyricsColumns(text, columnSplitStartsWith) {
      const stanzas = text.trim().split(/\n\n+/);
      let splitAt = -1;

      if (columnSplitStartsWith) {
        splitAt = stanzas.findIndex((stanza) =>
          stanza.trimStart().startsWith(columnSplitStartsWith)
        );
      }

      if (splitAt <= 0) {
        const mid = Math.ceil(stanzas.length / 2);
        return {
          left: stanzas.slice(0, mid).join('\n\n'),
          right: stanzas.slice(mid).join('\n\n')
        };
      }

      return {
        left: stanzas.slice(0, splitAt).join('\n\n'),
        right: stanzas.slice(splitAt).join('\n\n')
      };
    }

    function openVideo(videoKey) {
      const meta = MYSTERY_VIDEOS[videoKey] || MYSTERY_VIDEOS.drake;
      if (videoEl.getAttribute('src') !== meta.src) {
        videoEl.setAttribute('src', meta.src);
        videoEl.load();

      if (videoTitleName) videoTitleName.textContent = meta.name;
      if (videoTitleCredit) videoTitleCredit.textContent = meta.credit;

      videoOverlay.classList.add('open');

      document.body.style.overflow = 'hidden';
      videoEl.volume = 1;
      videoEl.play().catch(() => {});

    let lyricsKaraokeTimers = [];
    let lyricsKaraokeState = {
      active: false,
      startedAt: 0,
      layout: null,
      lineEls: []
    };

    function isLyricsMobileLayout() {
      return window.matchMedia('(max-width: 767px)').matches;
    }

    function clearLyricsKaraokeTimers() {
      lyricsKaraokeTimers.forEach(clearTimeout);
      lyricsKaraokeTimers = [];
    }

    function clearLyricsKaraokeDom() {
      lyricsText.replaceChildren();
      lyricsTextLeft.replaceChildren();
      lyricsTextRight.replaceChildren();
    }

    function clearLyricsKaraoke() {
      clearLyricsKaraokeTimers();
      clearLyricsKaraokeDom();
      lyricsKaraokeState.active = false;
      lyricsKaraokeState.layout = null;
      lyricsKaraokeState.lineEls = [];
    }

    function buildKaraokeLines(container, text) {
      return text.split('\n').map((line) => {
        const el = document.createElement('span');
        const blank = line.trim() === '';
        el.className = blank ? 'lyrics-line lyrics-line--blank' : 'lyrics-line';
        el.textContent = blank ? '\u00a0' : line;
        container.appendChild(el);
        return el;
      });
    }

    function buildLyricsKaraokeDom(isMobile) {
      clearLyricsKaraokeDom();

      if (isMobile) {
        return buildKaraokeLines(lyricsText, activeLyricsSong.lyrics);
      }

      const columns = splitLyricsColumns(
        activeLyricsSong.lyrics,
        activeLyricsSong.columnSplitStartsWith
      );
      return [
        ...buildKaraokeLines(lyricsTextLeft, columns.left),
        ...buildKaraokeLines(lyricsTextRight, columns.right)
      ];
    }

    function lyricsLineAppearAt(index, lineEls) {
      let delay = 400;
      for (let i = 0; i < index; i++) {
        delay += lineEls[i].classList.contains('lyrics-line--blank') ? 600 : 1800;
      }
      return delay;
    }

    function scheduleLyricsKaraoke(lineEls, isMobile, elapsedMs) {
      clearLyricsKaraokeTimers();
      lyricsKaraokeState.lineEls = lineEls;

      lineEls.forEach((el, index) => {
        const appearAt = lyricsLineAppearAt(index, lineEls);
        const blank = el.classList.contains('lyrics-line--blank');

        if (appearAt <= elapsedMs) {
          el.classList.add('is-sung');
          return;
        }

        const timer = setTimeout(() => {
          el.classList.add('is-sung');
          if (isMobile && !blank) {
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth', inline: 'nearest' });
          }
        }, appearAt - elapsedMs);
        lyricsKaraokeTimers.push(timer);
      });

      if (isMobile) {
        const current = [...lineEls].reverse().find((el) => el.classList.contains('is-sung') && !el.classList.contains('lyrics-line--blank'));
        if (current) {
          current.scrollIntoView({ block: 'nearest', behavior: 'auto', inline: 'nearest' });
        }
      } else {
        lyricsBox.scrollTop = 0;
      }
    }

    function startLyricsKaraoke(resumeElapsedMs) {
      const isMobile = isLyricsMobileLayout();
      const isResume = typeof resumeElapsedMs === 'number';
      const elapsedMs = isResume ? Math.max(0, resumeElapsedMs) : 0;

      clearLyricsKaraokeTimers();

      if (!isResume) {
        lyricsKaraokeState.startedAt = Date.now();
      }

      const lineEls = buildLyricsKaraokeDom(isMobile);
      lyricsKaraokeState.active = true;
      lyricsKaraokeState.layout = isMobile ? 'mobile' : 'desktop';
      scheduleLyricsKaraoke(lineEls, isMobile, elapsedMs);
    }

    function syncLyricsKaraokeLayout() {
      if (!lyricsKaraokeState.active || !lyricsOverlay.classList.contains('open')) return;

      const nextLayout = isLyricsMobileLayout() ? 'mobile' : 'desktop';
      if (nextLayout === lyricsKaraokeState.layout) return;

      const elapsedMs = Date.now() - lyricsKaraokeState.startedAt;
      startLyricsKaraoke(elapsedMs);
    }

    function openLyrics(song) {
      activeLyricsSong = song || pickRandomLyricsSong();

      const cs = getComputedStyle(document.body);

      lyricsOverlay.classList.add('open');
      lyricsOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      if (location.pathname === '/' && location.search.length > 1) {
        return /^[?]+$/.test(location.search);

      return false;

      else if (pick.type === 'richbob') openRichbob();
      else if (pick.type === 'diamonds') openDiamonds();
      else openLyrics();
    }

    window.isMysteryUrl = isMysteryUrl;

    richbobClose.addEventListener('click', closeRichbob);
    diamondsClose.addEventListener('click', closeDiamonds);
    lyricsClose.addEventListener('click', closeLyrics);

    const lyricsLayoutQuery = window.matchMedia('(max-width: 767px)');
    let lyricsLayoutResizeTimer = null;
    function onLyricsLayoutChange() {
      syncLyricsKaraokeLayout();
    }
    if (typeof lyricsLayoutQuery.addEventListener === 'function') {
      lyricsLayoutQuery.addEventListener('change', onLyricsLayoutChange);
    } else if (typeof lyricsLayoutQuery.addListener === 'function') {
      lyricsLayoutQuery.addListener(onLyricsLayoutChange);
    }
    window.addEventListener('resize', () => {
      window.clearTimeout(lyricsLayoutResizeTimer);
      lyricsLayoutResizeTimer = window.setTimeout(syncLyricsKaraokeLayout, 100);
    });

    videoOverlay.addEventListener('click', (e) => {
      if (e.target === videoOverlay) closeVideo();
    });

    richbobOverlay.addEventListener('click', (e) => {
      if (e.target === richbobOverlay) closeRichbob();

    diamondsOverlay.addEventListener('click', (e) => {
      if (e.target === diamondsOverlay) closeDiamonds();
    });

    lyricsOverlay.addEventListener('click', (e) => {
      if (e.target === lyricsOverlay) closeLyrics();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (videoOverlay.classList.contains('open')) closeVideo();
      if (richbobOverlay.classList.contains('open')) closeRichbob();
      if (diamondsOverlay.classList.contains('open')) closeDiamonds();
      if (lyricsOverlay.classList.contains('open')) closeLyrics();
    });

    videoPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (videoEl.paused) videoEl.play().catch(() => {});
      else videoEl.pause();
    });

    videoEl.addEventListener('play', () => { videoPlay.textContent = 'pause'; });
    videoEl.addEventListener('pause', () => { videoPlay.textContent = 'play'; });

    // Reveal headlines after page load
    function revealHeadlines() {
      const headlines = document.querySelectorAll('.headline');
      headlines.forEach((headline, index) => {
        setTimeout(() => {
          headline.style.display = 'block'; // Show the headline
        }, 333 + index * 666); // Delay for each - "about" first
      });

    function revealPage() {
      const overlay = document.getElementById('introOverlay');
      if (overlay) {
        overlay.classList.add('is-done');
        overlay.setAttribute('aria-hidden', 'true');
      }
      document.body.classList.add('is-ready');
      revealHeadlines();
    }

    // Mode is already applied under the intro; show devil then reveal themed page
    (function runIntro() {
      const overlay = document.getElementById('introOverlay');
      const mode = window.__homeMode || (document.body.classList.contains('heated') ? 'heated' : 'normal');

      // Re-assert theme while animation plays so chrome never flashes wrong
      document.body.classList.remove('normal', 'heated');
      document.body.classList.add(mode);
      applyHammerTheme(mode);

      if (!overlay) {
        revealPage();
        return;
      }

      overlay.style.backgroundColor = mode === 'heated' ? '#ff0000' : '#ffffff';
      const devil = overlay.querySelector('.intro-devil');
      if (devil) {
        devil.style.filter = mode === 'heated' ? 'brightness(0) invert(1)' : 'none';
      }

      setTimeout(revealPage, 1500);
    })();

  <script>
    (function launchMysteryFromUrl() {
      function run() {
        if (!window.isMysteryUrl || !window.isMysteryUrl()) return;
        if (window.__mysteryUrlTriggered) return;
        window.__mysteryUrlTriggered = true;
        if (typeof window.triggerMysteryRandom === 'function') {
          window.triggerMysteryRandom();
        }
      }

      function waitForReady() {
        if (document.body.classList.contains('is-ready')) {
          setTimeout(run, 100);
          return;
        }

        const observer = new MutationObserver(function () {
          if (document.body.classList.contains('is-ready')) {
            observer.disconnect();
            setTimeout(run, 100);
          }
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      }

      waitForReady();
    })();
  </script>
