<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0c0b0a">
  <title>STILL</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --fg: #f3efe6;
      --dim: rgba(243, 239, 230, 0.55);
      --line: rgba(243, 239, 230, 0.16);
      --amber: #ffb25a;
      --safe-b: max(16px, env(safe-area-inset-bottom));
      --safe-t: max(12px, env(safe-area-inset-top));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #070605;
      display: block;
    }

    .chrome {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--safe-t) 16px var(--safe-b);
    }

    .top, .bottom, .gate, .viewer, button {
      pointer-events: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--amber);
    }

    .mark i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      display: block;
    }

    body.is-live .mark i {
      animation: blink 1.6s steps(1) infinite;
    }

    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.25; }
    }

    .counter {
      text-align: right;
      color: var(--dim);
      line-height: 1.45;
    }

    .counter b {
      display: block;
      color: var(--fg);
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .side {
      display: flex;
      gap: 8px;
    }

    .side.right { justify-content: flex-end; }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(12, 11, 10, 0.45);
      color: var(--fg);
      font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    button.on {
      color: var(--amber);
      border-color: rgba(255, 178, 90, 0.45);
    }

    button:disabled { opacity: 0.35; }

    .shutter {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 2px solid rgba(243, 239, 230, 0.85);
      background: transparent;
      padding: 0;
      position: relative;
    }

    .shutter::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #f4f0e8;
    }

    .shutter:active::after { transform: scale(0.92); }

    .thumb {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 4px;
      overflow: hidden;
      border-color: var(--line);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gate, .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate { background: rgba(8, 7, 6, 0.28); }

    body.is-live .gate { display: none; }

    .card {
      width: min(340px, 100%);
      padding: 26px 22px 22px;
      background: rgba(16, 14, 12, 0.82);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(16px);
    }

    .card h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--dim);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    .card .go {
      width: 100%;
      background: var(--fg);
      color: #141210;
      border-color: transparent;
      min-height: 44px;
    }

    .viewer {
      background: rgba(8, 7, 6, 0.92);
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    body.reviewing .viewer { display: flex; }
    body.reviewing .chrome { display: none; }

    .viewer img {
      max-width: min(920px, 100%);
      max-height: calc(100dvh - 140px);
      width: auto;
      height: auto;
      background: #000;
    }

    .viewer .row {
      display: flex;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-b) + 108px);
      transform: translateX(-50%);
      background: rgba(16, 14, 12, 0.9);
      border: 1px solid var(--line);
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show { opacity: 1; }

    .flash {
      position: fixed;
      inset: 0;
      background: #f7f1e6;
      opacity: 0;
      pointer-events: none;
    }

    .flash.pop { animation: flash 180ms ease-out; }

    @keyframes flash {
      0% { opacity: 0.55; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="flash" id="flash"></div>

  <div class="chrome">
    <div class="top">
      <div class="mark"><i></i> Still</div>
      <div class="counter">
        <b id="clock">--:--:--</b>
        <span id="tape">T-00:00</span>
      </div>
    </div>
    <div class="bottom">
      <div class="side">
        <button type="button" id="flip" disabled>Flip</button>
        <button type="button" id="dateBtn" class="on" disabled>Date</button>
      </div>
      <button type="button" class="shutter" id="shutter" disabled aria-label="Take photo"></button>
      <div class="side right">
        <button type="button" class="thumb" id="thumb" hidden aria-label="Last photo">
          <img alt="" id="thumbImg">
        </button>
      </div>
    </div>
  </div>

  <div class="gate" id="gate">
    <div class="card">
      <h1>Still</h1>
      <p>A paused-tape camera. Soft color, a light tracking bar, date burned into the frame. Grain stays quiet.</p>
      <button type="button" class="go" id="start">Open camera</button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <img id="review" alt="Captured still">
    <div class="row">
      <button type="button" id="save">Save</button>
      <button type="button" id="closeReview">Back</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const view = document.getElementById('view');
    const vctx = view.getContext('2d', { alpha: false });
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.autoplay = true;

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true, alpha: false });

    const state = {
      stream: null,
      facing: 'environment',
      running: false,
      dateOn: true,
      startedAt: 0,
      raf: 0,
      lastShot: null,
      holdStill: null,
      holdUntil: 0
    };

    const buf = {
      y: null, u: null, v: null, tmp: null, y2: null, w: 0, h: 0
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function stampLines(date) {
      const h = date.getHours();
      const m = pad(date.getMinutes());
      const s = pad(date.getSeconds());
      const day = date.getDate();
      const mon = date.getMonth() + 1;
      return [h + ':' + m + ':' + s, day + '. ' + mon + '.' + date.getFullYear()];
    }

    function tapeLabel(ms) {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return 'T-' + pad(m) + ':' + pad(s);
    }

    function ensureBuffers(w, h) {
      const n = w * h;
      if (buf.w === w && buf.h === h) return;
      buf.w = w;
      buf.h = h;
      buf.y = new Float32Array(n);
      buf.u = new Float32Array(n);
      buf.v = new Float32Array(n);
      buf.tmp = new Float32Array(n);
      buf.y2 = new Float32Array(n);
      buf.extra = new Float32Array(n);
    }

    function boxBlurH(src, dst, w, h, r) {
      const inv = 1 / (r * 2 + 1);
      for (let y = 0; y < h; y++) {
        const row = y * w;
        let acc = 0;
        for (let k = -r; k <= r; k++) acc += src[row + Math.max(0, k)];
        for (let x = 0; x < w; x++) {
          dst[row + x] = acc * inv;
          acc -= src[row + Math.max(0, x - r)];
          acc += src[row + Math.min(w - 1, x + r + 1)];
        }
      }
    }

    function boxBlurV(src, dst, w, h, r) {
      const inv = 1 / (r * 2 + 1);
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let k = -r; k <= r; k++) acc += src[Math.max(0, k) * w + x];
        for (let y = 0; y < h; y++) {
          dst[y * w + x] = acc * inv;
          acc -= src[Math.max(0, y - r) * w + x];
          acc += src[Math.min(h - 1, y + r + 1) * w + x];
        }
      }
    }

    function hash(n) {
      n = (n ^ 61) ^ (n >>> 16);
      n = n + (n << 3);
      n = n ^ (n >>> 4);
      n = Math.imul(n, 0x27d4eb2d);
      n = n ^ (n >>> 15);
      return (n >>> 0) / 4294967295;
    }

    function paintStamp(ctx, w, h, date) {
      const lines = stampLines(date);
      const size = Math.max(13, Math.round(h * 0.03));
      ctx.save();
      ctx.font = '600 ' + size + 'px ui-monospace, Menlo, monospace';
      ctx.textBaseline = 'top';
      ctx.lineJoin = 'round';
      ctx.miterLimit = 2;
      ctx.lineWidth = Math.max(3, size * 0.18);
      ctx.strokeStyle = 'rgba(0,0,0,0.78)';
      ctx.fillStyle = 'rgba(236, 232, 220, 0.94)';
      const x = Math.round(w * 0.045);
      let y = Math.round(h * 0.78);
      lines.forEach((line) => {
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
        y += size * 1.28;
      });
      ctx.restore();
    }

    function applyStill(image, w, h, opts) {
      ensureBuffers(w, h);
      const d = image.data;
      const yA = buf.y;
      const uA = buf.u;
      const vA = buf.v;
      const tmp = buf.tmp;
      const y2 = buf.y2;
      const n = w * h;

      for (let i = 0, p = 0; i < n; i++, p += 4) {
        const r = d[p], g = d[p + 1], b = d[p + 2];
        yA[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        uA[i] = -0.169 * r - 0.331 * g + 0.5 * b;
        vA[i] = 0.5 * r - 0.419 * g - 0.081 * b;
      }

      const rh = Math.max(4, Math.round(w / 58));
      const rv = Math.max(1, Math.round(h / 110));
      const uBlur = buf.extra;
      boxBlurH(uA, tmp, w, h, rh);
      boxBlurH(tmp, uA, w, h, rh);
      boxBlurV(uA, uBlur, w, h, rv);
      boxBlurH(vA, tmp, w, h, rh);
      boxBlurH(tmp, vA, w, h, rh);
      boxBlurV(vA, tmp, w, h, rv);
      const vBlur = tmp;

      boxBlurH(yA, y2, w, h, 1);

      const shift = Math.max(2, Math.round(w * 0.004));
      const band = Math.max(6, Math.round(h * 0.02));
      const bandTop = h - band;
      const live = opts.live;
      const seed = (opts.seed || 1) | 0;

      for (let y = 0; y < h; y++) {
        const row = y * w;
        const above = Math.max(0, y - 1) * w;
        const below = Math.min(h - 1, y + 1) * w;
        const scan = (y & 1) ? 0.972 : 1;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          let luma = y2[i] * 0.8 + yA[above + x] * 0.1 + yA[below + x] * 0.1;
          luma *= scan;

          const cx = Math.min(w - 1, Math.max(0, x - shift));
          let U = uBlur[row + cx];
          let V = vBlur[row + cx];

          const nx = (x / (w - 1)) * 2 - 1;
          const ny = (y / (h - 1)) * 2 - 1;
          const vig = 1 - 0.2 * (nx * nx * 0.85 + ny * ny);
          luma *= vig;

          const noise = (hash(i * 13 + seed) - 0.5) * (live ? 3.2 : 4.2);
          luma += noise * (0.65 + (1 - luma / 255) * 0.35);

          if (y >= bandTop) {
            const t = (y - bandTop) / band;
            const smearX = Math.max(0, x - 3);
            luma = luma * (1 - t * 0.35) + y2[row + smearX] * (t * 0.22);
            luma += (hash(y * 92821 + seed) - 0.5) * 10 * t;
            U *= 1 - t * 0.45;
            V *= 1 - t * 0.45;
          }

          let Y = luma * 0.9 + 16;
          if (Y < 0) Y = 0;
          if (Y > 244) Y = 244 - (Y - 244) * 0.25;

          let r = Y + 1.402 * V;
          let g = Y - 0.344 * U - 0.714 * V;
          let b = Y + 1.772 * U;

          const shade = Math.min(1, Math.max(0, Y / 230));
          r = r * (1.03 + shade * 0.03) + 7;
          g = g * 0.985 + 5;
          b = b * (0.9 + shade * 0.05) + 9;

          const p = i * 4;
          d[p] = r < 0 ? 0 : r > 255 ? 255 : r;
          d[p + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
          d[p + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
          d[p + 3] = 255;
        }
      }

      if (!live) return;
      const tearY = (seed % (h - 8));
      if ((seed % 110) === 0) {
        for (let y = tearY; y < tearY + 2 && y < h; y++) {
          const row = y * w * 4;
          const next = d.slice(row, row + w * 4);
          const slip = 2;
          for (let x = 0; x < w; x++) {
            const src = Math.max(0, x - slip) * 4;
            const dst = row + x * 4;
            d[dst] = next[src];
            d[dst + 1] = next[src + 1];
            d[dst + 2] = next[src + 2];
          }
        }
      }
    }

    function frameSize(forCapture) {
      const rect = view.getBoundingClientRect();
      const cssW = Math.max(2, rect.width);
      const cssH = Math.max(2, rect.height);
      const longEdge = forCapture ? 1280 : 760;
      let w, h;
      if (cssW >= cssH) {
        w = longEdge;
        h = Math.round(longEdge * (cssH / cssW));
      } else {
        h = longEdge;
        w = Math.round(longEdge * (cssW / cssH));
      }
      w -= w & 1;
      h -= h & 1;
      return { w: Math.max(2, w), h: Math.max(2, h) };
    }

    function drawVideoCover(ctx, w, h) {
      const vw = video.videoWidth || 4;
      const vh = video.videoHeight || 3;
      const scale = Math.max(w / vw, h / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const dx = (w - dw) / 2;
      const dy = (h - dh) / 2;
      ctx.save();
      if (state.facing === 'user') {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, -dx - dw, dy, dw, dh);
      } else {
        ctx.drawImage(video, dx, dy, dw, dh);
      }
      ctx.restore();
    }

    function renderFrame(forCapture) {
      const size = frameSize(forCapture);
      if (work.width !== size.w || work.height !== size.h) {
        work.width = size.w;
        work.height = size.h;
      }
      wctx.imageSmoothingEnabled = true;
      if (state.running && video.readyState >= 2) {
        drawVideoCover(wctx, size.w, size.h);
      }
      if (state.dateOn) paintStamp(wctx, size.w, size.h, new Date());
      const image = wctx.getImageData(0, 0, size.w, size.h);
      applyStill(image, size.w, size.h, {
        live: !forCapture,
        seed: (Date.now() / 80) | 0
      });
      wctx.putImageData(image, 0, 0);
      return work;
    }

    function paintView(source) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = view.getBoundingClientRect();
      const pw = Math.max(2, Math.round(rect.width * dpr));
      const ph = Math.max(2, Math.round(rect.height * dpr));
      if (view.width !== pw || view.height !== ph) {
        view.width = pw;
        view.height = ph;
      }
      vctx.imageSmoothingEnabled = true;
      vctx.imageSmoothingQuality = 'medium';
      vctx.drawImage(source, 0, 0, pw, ph);
    }

    function demoPlate() {
      const size = frameSize(false);
      work.width = size.w;
      work.height = size.h;
      const g = wctx.createLinearGradient(0, 0, size.w, size.h);
      g.addColorStop(0, '#6d8cae');
      g.addColorStop(0.45, '#d7c2a4');
      g.addColorStop(1, '#8d4d45');
      wctx.fillStyle = g;
      wctx.fillRect(0, 0, size.w, size.h);
      wctx.fillStyle = '#1c2430';
      wctx.fillRect(size.w * 0.12, size.h * 0.18, size.w * 0.34, size.h * 0.46);
      wctx.fillStyle = '#e7d7bf';
      wctx.fillRect(size.w * 0.16, size.h * 0.23, size.w * 0.11, size.h * 0.16);
      wctx.fillStyle = '#c4553a';
      wctx.beginPath();
      wctx.arc(size.w * 0.72, size.h * 0.42, size.w * 0.11, 0, Math.PI * 2);
      wctx.fill();
      wctx.fillStyle = '#2a241c';
      wctx.fillRect(0, size.h * 0.72, size.w, size.h * 0.28);
      if (state.dateOn) paintStamp(wctx, size.w, size.h, new Date());
      const image = wctx.getImageData(0, 0, size.w, size.h);
      applyStill(image, size.w, size.h, { live: false, seed: 4 });
      wctx.putImageData(image, 0, 0);
      paintView(work);
    }

    function loop() {
      if (!state.running) return;
      const now = performance.now();
      document.getElementById('clock').textContent = stampLines(new Date())[0];
      document.getElementById('tape').textContent = tapeLabel(now - state.startedAt);
      if (now < state.holdUntil && state.holdStill) {
        paintView(state.holdStill);
      } else if (video.readyState >= 2) {
        paintView(renderFrame(false));
      }
      state.raf = requestAnimationFrame(loop);
    }

    async function startCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach((t) => t.stop());
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: state.facing },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      state.stream = stream;
      video.srcObject = stream;
      await video.play();
      state.running = true;
      state.startedAt = performance.now();
      document.body.classList.add('is-live');
      document.getElementById('shutter').disabled = false;
      document.getElementById('flip').disabled = false;
      document.getElementById('dateBtn').disabled = false;
      cancelAnimationFrame(state.raf);
      loop();
    }

    function clickSound() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!clickSound.ctx) clickSound.ctx = new AC();
      const ctx = clickSound.ctx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(210, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    }

    async function takePhoto() {
      if (!state.running || video.readyState < 2) return;
      const flash = document.getElementById('flash');
      flash.classList.remove('pop');
      void flash.offsetWidth;
      flash.classList.add('pop');
      clickSound();
      const shot = renderFrame(true);
      state.holdStill = document.createElement('canvas');
      state.holdStill.width = shot.width;
      state.holdStill.height = shot.height;
      state.holdStill.getContext('2d').drawImage(shot, 0, 0);
      state.holdUntil = performance.now() + 420;
      const blob = await new Promise((resolve) => shot.toBlob(resolve, 'image/jpeg', 0.88));
      if (!blob) {
        toast('Could not save frame');
        return;
      }
      const when = new Date();
      const name = 'still-' + when.getFullYear() + pad(when.getMonth() + 1) + pad(when.getDate()) + '-' + pad(when.getHours()) + pad(when.getMinutes()) + pad(when.getSeconds()) + '.jpg';
      if (state.lastShot && state.lastShot.url) URL.revokeObjectURL(state.lastShot.url);
      const url = URL.createObjectURL(blob);
      state.lastShot = { blob, url, name };
      const thumb = document.getElementById('thumb');
      document.getElementById('thumbImg').src = url;
      thumb.hidden = false;
    }

    async function saveShot() {
      const shot = state.lastShot;
      if (!shot) return;
      const file = new File([shot.blob], shot.name, { type: 'image/jpeg' });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'STILL' });
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
      const a = document.createElement('a');
      a.href = shot.url;
      a.download = shot.name;
      a.click();
      toast('Downloaded');
    }

    function openReview() {
      if (!state.lastShot) return;
      document.getElementById('review').src = state.lastShot.url;
      document.body.classList.add('reviewing');
    }

    document.getElementById('start').addEventListener('click', async () => {
      const btn = document.getElementById('start');
      btn.disabled = true;
      try {
        await startCamera();
      } catch (err) {
        btn.disabled = false;
        toast('Camera blocked');
        console.warn(err);
      }
    });

    document.getElementById('shutter').addEventListener('click', takePhoto);
    document.getElementById('flip').addEventListener('click', async () => {
      state.facing = state.facing === 'environment' ? 'user' : 'environment';
      try { await startCamera(); } catch (err) { toast('Could not flip'); }
    });
    document.getElementById('dateBtn').addEventListener('click', () => {
      state.dateOn = !state.dateOn;
      document.getElementById('dateBtn').classList.toggle('on', state.dateOn);
    });
    document.getElementById('thumb').addEventListener('click', openReview);
    document.getElementById('save').addEventListener('click', saveShot);
    document.getElementById('closeReview').addEventListener('click', () => {
      document.body.classList.remove('reviewing');
    });

    window.addEventListener('resize', () => {
      if (!state.running) demoPlate();
    });

    demoPlate();
  </script>
</body>
</html>
